d:var(--glass-surface);color:var(--accent-strong);border:1px solid #ffffffaa;border-radius:14px;box-shadow:7px 7px 15px var(--shadow-dark),-7px -7px 15px var(--shadow-light);backdrop-filter:blur(12px)}.asset-note{color:var(--muted);font-size:11px;line-height:1.55}.hidden{display:none!important}.gadget-preview{position:fixed;z-index:14;left:24px;top:96px;width:min(350px,calc(100vw - 48px));max-height:calc(100dvh - 140px);overflow:auto;padding:16px;background:rgba(232,238,245,.94);border:1px solid #ffffffaa;border-radius:var(--radius-lg);box-shadow:10px 10px 24px var(--shadow-dark),-10px -10px 24px var(--shadow-light);backdrop-filter:blur(16px)}.gadget-preview.collapsed{max-height:48px;overflow:hidden;padding:8px 12px}.gadget-header{display:flex;align-items:center;justify-content:space-between;gap:8px}.gadget-preview h2{margin:0 0 10px;color:var(--accent-strong);font-size:16px}.gadget-header h2{margin:0}.gadget-collapse{padding:4px 8px!important;font-size:11px}.gadget-body{margin-top:10px}.gadget-preview select{width:100%;min-width:0;padding:8px 10px;border:0;border-radius:10px;background:var(--surface);color:var(--ink);box-shadow:inset 3px 3px 6px var(--shadow-dark),inset -3px -3px 6px var(--shadow-light)}.gadget-status{min-height:20px;margin:8px 0;color:var(--muted);font-size:11px}.gadget-status.error{color:var(--danger)}.gadget-items{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}.gadget-item{min-width:0;min-height:88px;padding:7px;border:1px solid var(--line);border-radius:10px;background:var(--surface);text-align:center}.gadget-item-icon{display:flex;align-items:center;justify-content:center;width:42px;height:42px;margin:0 auto 5px;border-radius:7px;background:var(--surface-dark);color:var(--danger);font-size:18px;font-weight:700}.gadget-item-icon img{display:block;width:100%;height:100%;object-fit:contain;image-rendering:pixelated}.gadget-item-name{display:block;overflow-wrap:anywhere;font-size:11px;line-height:1.25}.gadget-item.unavailable . </style>

</main>

<script>
(()=>{
'use strict';
const $=s=>document.querySelector(s), $$=s=>Array.from(document.querySelectorAll(s));
const token=document.body.dataset.token||'', screen=$('#screen'), panel=$('#panel'), status=$('#status');
let state=null, manifest=[], assets=new Map(), activeLayer='card', dirty=new Set(), previewOffsets=Object.create(null), drag=null, resize=null, pan=null, frame=0, dragFrame=0, resizeFrame=0, viewPan={x:0,y:0}, selectedSlot=0, busy=false, snapshotCounterOffset=122, editMode='move', snapEnabled=false, lastNormalizedKeys=[];
let gadgetPlayers=[], gadgetSelectedUuid='', gadgetKnownPlayers=new Map(), gadgetRequest=null, gadgetRequestId=0, gadgetPollTimer=0, gadgetPollTimeout=0, gadgetAbortController=null, gadgetHidden=false, gadgetDisposed=false, gadgetImageCache=new Map(), gadgetImageUrls=new Set();

const layerKeys={card:['trick-hud.card-offset-x','trick-hud.offset-down'],avatar:['trick-hud.avatar-offset-x','trick-hud.avatar-offset-down'],counter:['trick-hud.counter.offset-x','trick-hud.counter.offset-down']};
const text=v=>String(v==null?'':v); const n=v=>Number.isFinite(Number(v))?Number(v):0;
function values(){return state?.snapshot?.values||{}}
function geometry(){return state?.snapshot?.geometry||{screenWidth:640,screenHeight:360,bossBarBaselineY:20,actionBarBottomY:360,cards:[],avatars:[],counters:[],sampleCards:[],avatarLayouts:[],counterTiers:[]}}

function previewValue(key){return Object.prototype.hasOwnProperty.call(previewOffsets,key)?previewOffsets[key]:value(key)}

function setValue(key,val){const f=fieldSpec(key);if(!f||busy)return;let next=f.type==='boolean'?!!val:(f.type==='integer'?(typeof val==='string'?Number(val):Math.round(n(val))):text(val));if(f.type==='integer'&&layoutKeys.has(key))next=clampLayoutValue(key,next);if(!continuousYKey(key)){if(f.min!=null)next=Math.max(f.min,next);if(f.max!=null)next=Math.min(f.max,next)}delete previewOffsets[key];state.snapshot.values[key]=next;dirty.add(key);status.textContent='有未保存改动，点击“保存并应用”写入配置。';status.className='status';$('#hint').textContent=status.textContent;syncOneControl(key);syncCoords();scheduleRender()}
function setPreviewValue(key,val){const f=fieldSpec(key);if(!f||busy)return;const next=f.type==='integer'?Math.round(n(val)):val;previewOffsets[key]=next;dirty.add(key);status.textContent='有未保存改动，点击“保存并应用”写入配置。';status.className='status';$('#hint').textContent=status.textContent;syncOneControl(key);syncCoords();scheduleRender()}
function setCoordinateValue(key,val){if((fieldSpec(key)?.options||[]).length)setPreviewValue(key,val);else setValue(key,val)}
function invalidPreviewOptions(){return Object.keys(previewOffsets).filter(key=>{const options=fieldSpec(key)?.options||[];return options.length&&!options.some(option=>n(option)===n(previewOffsets[key]))})}
const primaryScaleKeys={card:'trick-hud.card-height',avatar:'trick-hud.avatar-scale',counter:'trick-hud.counter.scale'};
const handleDirections={nw:[-1,-1],n:[0,-1],ne:[1,-1],e:[1,0],se:[1,1],s:[0,1],sw:[-1,1],w:[-1,0]};
let eventAlt=false;
function snapOffset(kind,axis,candidate,start,box){if(!snapEnabled||eventAlt)return Math.round(candidate);const center=axis==='x'?box.x+box.w/2:box.y+box.h/2;const delta=candidate-start;const nextCenter=center+delta;const target=axis==='x'?320:180;return Math.abs(nextCenter-target)<=8?Math.round(candidate+(target-nextCenter)):Math.round(candidate)}
function nearestOption(key,target){const f=fieldSpec(key),options=f?.options||[];return options.length?options.reduce((best,item)=>Math.abs(n(item)-target)<Math.abs(n(best)-target)?item:best,options[0]):Math.round(target)}
function legalScaleOption(kind,key,target){const f=fieldSpec(key),options=(f?.options||[]).slice().sort((a,b)=>Math.abs(n(a)-target)-Math.abs(n(b)-target)),original=state.snapshot.values[key],v=viewport();for(const option of (options.length?options:[Math.round(target)])){state.snapshot.values[key]=typeof option==='number'?option:n(option);const box=rawBoxFor(kind);state.snapshot.values[key]=original;if(box.w<=v.w&&box.h<=v.h)return option}state.snapshot.values[key]=original;return original}
function syncOneControl(key){const f=fieldSpec(key);$$('[data-key="'+key+'"]').forEach(input=>{if(input.type==='checkbox')input.checked=!!value(key);else input.value=previewValue(key)})}
function asset(id){return assets.get(id)}
