<style>

</style>
</head>

<script>
(()=>{
'use strict';

const primaryScaleKeys={card:'trick-hud.card-height',avatar:'trick-hud.avatar-scale',counter:'trick-hud.counter.scale',hotbar:'hotbar-hud.scale'};
const handleDirections={nw:[-1,-1],n:[0,-1],ne:[1,-1],e:[1,0],se:[1,1],s:[0,1],sw:[-1,1],w:[-1,0]};

function cssScale(){return screenScale()}

function cardGeometry(){const g=geometry(),h=n(value('trick-hud.card-height'));return g.cards.find(x=>n(x.height)===h)||g.cards[0]||{width:35,height:h,advance:36}}
function avatarGeometry(){const g=geometry(),scale=n(value('trick-hud.avatar-scale'))||6,outlined=!!value('trick-hud.avatar-outline.enabled'),layouts=g.avatarLayouts||[],layout=layouts.find(x=>n(x.middleScale)===scale&&!!x.outlined===outlined);if(!layout)throw new Error('头像资源档位 '+scale+' 未在 avatarLayouts 中声明，无法预览；请重新生成资源包。');return layout}
function counterGeometry(){const g=geometry(),scale=n(value('trick-hud.counter.scale'))||100,tier=(g.counterTiers||[]).find(x=>n(x.scale)===scale);if(!tier)throw new Error('记牌器资源档位 '+scale+' 未在 counterTiers 中声明，无法预览；请重新生成资源包。');return tier}

function setLayerBox(kind,b){const el=screen.querySelector('.layer[data-layer="'+kind+'"]');if(!el)return;el.style.left=b.x+'px';el.style.top=b.y+'px';el.style.width=b.w+'px';el.style.height=b.h+'px';el.classList.toggle('selected',activeLayer===kind);el.dataset.x=b.x;el.dataset.y=b.y;el.dataset.w=b.w;el.dataset.h=b.h}
