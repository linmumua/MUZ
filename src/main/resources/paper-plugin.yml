name: MUZ
main: dev.mumu.doudizhu.DoudizhuPlugin
version: ${version}
api-version: "1.20"
folia-supported: true
author: linmumua
description: MUZ card table plugin for Paper and Purpur.
dependencies:
  server:
    CraftEngine:
      load: AFTER
      required: false
    PlaceholderAPI:
      load: AFTER
      required: false
    Vault:
      load: AFTER
      required: false
    CMI:
      load: AFTER
      required: false
    CMILib:
      load: AFTER
      required: false
    EzEconomy:
      load: AFTER
      required: false
    XConomy:
      load: AFTER
      required: false
commands:
  muz:
    aliases: [MUZ]
    description: Manage MUZ tables and rounds.
    usage: /muz help
    permission: muz.command
permissions:
  muz.command:
    default: true
  muz.admin:
    default: op
