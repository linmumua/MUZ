name: MUZ
main: linmumua.doudizhu.DoudizhuPlugin
version: ${version}
api-version: "${apiVersion}"
# Folia 支持声明（正式，2026-09-24 起）：MuzScheduler 已建立 GlobalRegionScheduler、
# RegionScheduler、EntityScheduler 与 AsyncScheduler 四条 owner lane，牌桌、玩家、实体与
# 麻将领域的 owner 路由均已收口到调度门面；owner 路由契约测试与真实 Folia 服务端运行期
# 冒烟（加载、开局、区域线程违规清零）均已通过，因此本键由迁移期的临时值转为正式 true。
#
# 历史沿革（勿删）：本键此前长期为 false，中途为采集实服证据临时改过 true 并在结束后回滚；
# 迁移动机、逐轮冒烟结论与仍存在的风险都记录在 AGENTS.md 与 README.md，改动前先读那两处。
# 仍需注意：真实 Folia 实服矩阵并未覆盖全部路径（关闭期 owner 清理注册会被调度闸门拒绝、
# 区块卸载重载与全量清理 barrier 尚未取得实服证据），这些残余风险在文档中如实登记。
folia-supported: true
author: linmumua
description: MUZ card table plugin for Paper and Purpur.
# 不声明 libraries：MUZ 自己不需要 Paper 从 Maven 下载任何运行时，
# SnakeYAML 已重定位打进 JAR，写个空的 libraries 键反而会让 Paper 解析报错。
# paper-plugin.yml 不支持 commands 段，/muz 改在 onEnable 里通过 CommandMap 注册。
# 命令的描述、用法、别名和权限都挪到了 DoudizhuPlugin.registerMuzCommand()。
dependencies:
  server:
    # 这三个有直接的 Java import，必须 join-classpath。
    # paper-plugin.yml 默认让每个插件用独立 ClassLoader，不打开就取不到对方的类，
    # 启动时会抛 NoClassDefFoundError。
    CraftEngine:
      load: BEFORE
      required: false
      join-classpath: true
    PlaceholderAPI:
      load: BEFORE
      required: false
      join-classpath: true
    Vault:
      load: BEFORE
      required: false
      join-classpath: true
    # 下面几个只通过插件管理器检测是否存在，代码里没有 import，不需要共享 ClassLoader。
    CMI:
      load: BEFORE
      required: false
      join-classpath: false
    CMILib:
      load: BEFORE
      required: false
      join-classpath: false
    EzEconomy:
      load: BEFORE
      required: false
      join-classpath: false
    XConomy:
      load: BEFORE
      required: false
      join-classpath: false
permissions:
  muz.command:
    default: true
  muz.admin:
    default: op
