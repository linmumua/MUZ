# DouDizhuPaper 配置文件
#
# 数值项写 0 表示"用插件内置的默认值"，行尾注释标了默认值是多少。
# 想改就把 0 换成你要的数字；改完想退回默认，填回 0 即可。
#
# 少数项的 0 是真实取值而不是"取默认"，所以出厂就保留原值、行尾也不标默认：
#   audio.bgm-volume / effect-volume（0 = 静音）
#   actionbar.turn-countdown-seconds（0 = 关闭倒计时）
#   bot.action-delay-min-ticks（0 = 机器人立刻出牌）
#   room-levels.*.multiplier（0 = 该房间不结算）
#   render.card-hover.interpolation-ticks / animation-type、render.layout.status-line-width
#   ai.deepseek.max-tokens（0 = 不限制）、trick-hud 的 5 项尺寸、storage.sql.mysql.port

table:
  # 放置桌子时的整体垂直偏移
  spawn-offset-y: 0  # 默认 -0.55
  # 放桌位置被方块挡住时播放的警告音格式：音效名 [音量] [音高]
  placement-blocked-sound: "minecraft:block.note_block.bass 0.55 0.75"

craftengine-items:
  table:
    # 桌子显示物品的完整 item_model；可直接写成类似 magicstore:medieval_furnitures_fullpack_v4_6
    item-model: muz:furniture/table_large
    # 桌子显示名称，仅用于物品显示名
    item-name: "Dou Dizhu Table"
  chair:
    # 椅子显示物品的完整 item_model；可直接写成类似 magicstore:medieval_furnitures_fullpack_v4_6
    item-model: muz:furniture/chair_large
    # 板凳显示名称，仅用于物品显示名
    item-name: "Dou Dizhu Chair"

render:
  furniture-scale:
    # 桌子模型大小。新桌子模型本身就是 2.5x2.5 格的成品尺寸，所以按 1.0 渲染；
    # 旧模型只有 0.875 格，才需要放大 2.25 倍。
    table: 0  # 默认 1.0
    # 椅子模型大小。同上，新椅子模型已是 0.875 宽 / 1.56 高的成品尺寸。
    chair: 0  # 默认 1.0
  text-scale:
    # 座位信息和上一手文字大小
    small: 0  # 默认 0.46
    # 桌面主状态文字大小
    status: 0  # 默认 0.72
    # 按钮和牌面上方的小标签大小
    label: 0  # 默认 0.40
  status-name:
    # 顶栏名字的单独缩放
    scale: 0  # 默认 0.46
  status-name-offset:
    # 顶栏名字左右偏移
    lateral: 0.0
    # 顶栏名字上下偏移
    vertical: 0  # 默认 0.56
    # 顶栏名字前后偏移
    depth: 0.0
  seat-name:
    # 椅子外侧名字的单独缩放
    scale: 0  # 默认 0.46
  seat-name-offset:
    # 椅子外侧名字左右偏移
    lateral: 0.0
    # 椅子外侧名字上下偏移
    vertical: 0  # 默认 -0.04
    # 椅子外侧名字前后偏移
    depth: 0.0
  empty-seat:
    # 空位文字的单独缩放
    scale: 0  # 默认 0.9
  empty-seat-offset:
    # 空位文字左右偏移
    lateral: 0.0
    # 空位文字上下偏移
    vertical: 0  # 默认 1.5
    # 空位文字前后偏移
    depth: 0.0
  seat-info:
    # 座位副标题（座位号、准备状态、分数等）大小
    scale: 0  # 默认 0.5
  seat-info-offset:
    # 座位副标题左右偏移
    lateral: 0.0
    # 座位副标题上下偏移
    vertical: 0  # 默认 -0.5
    # 座位副标题前后偏移
    depth: 0.0
  # 玩家自己手牌区的牌整体基础大小（相较上一版缩小 30%）
  private-card-scale: 0  # 默认 0.8
  private-card-size:
    # 只改手牌宽度
    width: 0  # 默认 0.50
    # 只改手牌高度
    height: 0  # 默认 0.50
    # 只改手牌厚度
    depth: 0  # 默认 0.50
  private-hand-offset:
    # 三家手牌一起左右平移
    lateral: 0.03
    # 三家手牌一起上下平移
    vertical: 1.90
    # 三家手牌一起朝桌心/远离桌心移动（正数更靠近桌子中心）
    depth: 0.55
  card-hover:
    # 鼠标对准牌时长宽的放大倍数（厚度恒定，避免射线交点随悬停漂移）
    scale: 0  # 默认 1.08
    # 鼠标对准牌时的上移高度
    lift: 0  # 默认 0.06
    # 牌预览动画时长（tick）
    interpolation-ticks: 6
    # 牌预览动画类型: 0=线性 1=缓出 2=缓入缓出 3=回弹
    animation-type: 1
  selected-card:
    # 已选中的牌当前不再额外放大，保留此项仅兼容旧配置
    scale: 0  # 默认 1.00
    # 已选中的牌会额外上移多少
    lift: 0  # 默认 0.18
  hover-glow:
    # 鼠标指向牌时是否发光
    enabled: true
    # 悬停发光的颜色，三个分量各取 0-255
    color:
      # 红色分量
      red: 0  # 默认 96
      # 绿色分量
      green: 0  # 默认 180
      # 蓝色分量
      blue: 0  # 默认 255
  selected-glow:
    # 已预选的牌是否发光
    enabled: true
    # 预选发光的颜色，三个分量各取 0-255
    color:
      # 红色分量
      red: 0  # 默认 255
      # 绿色分量
      green: 0  # 默认 226
      # 蓝色分量
      blue: 0  # 默认 92
  # 牌面数字标签离牌面的高度
  card-label-height: 0  # 默认 0.05
  card-label-offset:
    # 牌面数字标签左右偏移
    lateral: 0.05
    # 牌面数字标签前后偏移
    depth: 0.00
  # 手牌左右间距
  hand-spacing: 0  # 默认 0.1
  button-offset:
    # 按钮离桌子的远近
    distance: 0  # 默认 1.40
    # 按钮高度
    height: 0  # 默认 2.5
  button-layout:
    # 空位加入文字高度
    join-label-height: 0  # 默认 0.18
    # 空位加入文字大小
    join-label-scale: 0  # 默认 0.4
    # 操作按钮文字高度
    action-label-height: 0  # 默认 0.2
    # 操作按钮文字大小
    action-label-scale: 0  # 默认 0.4

    # 正前方座位按钮的基础距离
    front-base-distance: 0  # 默认 1.40
    # 左右两侧座位按钮的基础距离
    side-base-distance: 0  # 默认 1.72
    # 当 button-offset.distance 增大时，额外往外推的系数
    distance-factor: 0  # 默认 0.45
    # 按钮沿弧线展开的疏密倍率
    spacing-scale: 0  # 默认 1.2
    # 3 个按钮时使用的小弧度角
    arc-angle-small: 0  # 默认 30.0
    # 4 个按钮时使用的大弧度角
    arc-angle-large: 0  # 默认 42.0
    # 3 个按钮时使用的小弧形半径
    arc-radius-small: 0  # 默认 0.70
    # 4 个按钮时使用的大弧形半径
    arc-radius-large: 0  # 默认 0.8
  chair-visual-offset:
    # 椅子左右偏移
    lateral: 0.00
    # 椅子上下偏移
    vertical: 0  # 默认 0.35
  chair-hitbox-offset:
    # 空位"加入座位"交互箱左右偏移
    lateral: 0.00
    # 空位"加入座位"交互箱上下偏移
    vertical: 0  # 默认 0.02
  # 按钮判定框的尺寸不再手调，改为按 button-layout 里的文字缩放自动贴合文字。
  # 想让点击范围变大就调 join-label-scale / action-label-scale，文字大了判定框跟着大。
  button-hitbox-offset:
    # 按钮点击范围左右偏移
    lateral: 0.00
    # 按钮点击范围前后偏移
    depth: 0.00
    # 按钮点击范围上下偏移
    vertical: 0  # 默认 0.02
  # 相邻牌之间的前后错层，用来减少闪烁
  card-depth-offset: 0  # 默认 0.005
  # 桌面状态文字高度
  status-height: 0  # 默认 5.0
  # “上一手出牌详情”文字高度
  play-detail-height: 0  # 默认 4.0
  layout:
    # 桌面模型离锚点的高度
    table-display-height: 0  # 默认 0.55
    # 桌面碰撞体离锚点的高度
    table-collider-height: 0  # 默认 0.72
    # 椅子模型离锚点的基础高度
    chair-base-height: 0  # 默认 0.20
    # 椅子碰撞体离椅子的高度
    chair-collider-height: 0  # 默认 0.18
    # 玩家坐上去的挂载点高度
    chair-seat-height: 0  # 默认 0.18
    # 椅子交互箱离椅子的基础高度
    chair-interaction-height: 0  # 默认 0.38
    # 座位文字离椅子的高度
    chair-label-height: 0  # 默认 1.35
    # 桌面状态文字的最大宽度
    status-line-width: 250
    hand-center:
      # 三家手牌离桌心的距离
      distance: 0  # 默认 1.62
      # 三家手牌离地面的基础高度
      height: 0  # 默认 1.23
    # 三把椅子离桌心的距离；方块类椅子建议按整格调整
    chair-distance: 0  # 默认 2.5

# 出牌 HUD：屏幕顶部那一条「谁出的 + 出了什么」，头像与牌并排在同一行
# 本段单位是【屏幕像素】，和上面 render 段的世界坐标偏移不是一回事
trick-hud:
  # 总开关；关掉后完全不显示这条 HUD，也不占用 BossBar
  enabled: true
  # 正中间那个大头像（当前该出牌的人）的放大倍数；两侧小头像固定 4 倍。
  # 它决定头像盒高（12 * 本项），也就是两行不重叠所需的最小间距，
  # 改了要连 avatar-offset-down 一起核算，见那一项的说明。
  # 可取 2..16 的整数（资源包按这个范围预生成字形）。
  # 越界值会回退成 6 并留警告（不是钳到边界）：超范围的倍数没有预生成字形，
  # 照用会让头像整片变豆腐块。这一项和下面两项的「就近吸附」不是一套规则。
  #
  # 【6 倍占 72 像素高，不是 48】：48 是关掉描边后能看见的那张 8x8 脸，
  # 而字形盒恒按 12 行算：描边那两行永远参与度量（关描边只是不画），
  # 王冠还要再往上凸出 2 行。头像行要往下让开的就是这 72 像素。
  avatar-scale: 6
  # 头像右缘到第一张牌左缘的间距；允许为负，负值会让牌压在头像上
  avatar-gap: 6
  # 相邻两张牌左缘的间距。牌宽 35，小于 35 即为叠放；
  # 一手最多 20 张（四个三带的飞机），取 22 是为了整手牌不超出屏幕宽度
  card-step: 22
  # 牌面渲染高度（像素），也就是缩放。
  # 可取 32..56 的整数（步长 1，资源包按这个范围逐档预生成）。
  # 53 是贴图原始尺寸即 1:1。越界值会被钳到最近的边界并留警告。
  # 放大到 56 只是插值模糊，而且满手 20 张会横出屏幕，一般别超过 53。
  # 注意缩放后牌宽会等比变窄，叠放看着会变松，一般要把 card-step 一起调小
  card-height: 53
  # 整条 HUD 相对 BossBar 默认位置往下推多少像素。这里只调【牌那一行】，
  # 头像行由下面的 avatar-offset-down 单独调，两行互不影响。
  # 可取 0..80（步长 2）。写奇数会静默吸附到最近的偶数档，
  # 只有越界（如 -4、100）才会钳到边界并留警告。
  # 没有「往上」：BossBar 本来就贴着屏幕顶部，往上会直接出屏。
  offset-down: 50
  # 头像那一行往下推多少像素。与上面的 offset-down 【完全独立】：
  # 改 offset-down 不会动头像行，改这一项也不会动牌行。
  # 可取 0..400（步长 2，和牌行不是同一套值：头像行要让开的距离大得多）。
  # 写奇数会静默吸附到最近的偶数档，只有越界才钳到边界并留警告。
  #
  # 【两行会不会重叠要自己算】：这一项独立可调的代价就是插件不再替你保证不重叠。
  # 不重叠的条件是：avatar-offset-down >= offset-down + 12 * avatar-scale
  # 默认组合 50 + 12*6 = 122 正好相接、零重叠。配小了头像会压进牌里，
  # 插件会在控制台留警告并直接写出「建议把 avatar-offset-down 设为多少」，
  # 但仍按你写的值渲染。
  #
  # 【是 12 * avatar-scale，不是 8 或 10】：描边那两行永远参与字形度量
  # （运行期关掉 avatar-outline 只是不画描边像素），地主王冠还要再往上凸出 2 行。
  # 按 10 算会漏掉王冠那 2*avatar-scale 像素，地主的冠会压进牌行。
  avatar-offset-down: 122
  # 整条 HUD 的水平偏移：正数右移、负数左移，0 保持居中。三行一起动。
  # 这一项是任意整数，不受档位限制（靠负空格实现，不需要预生成字形）
  offset-x: 0
  # 牌行【单独】的水平偏移，叠加在上面那个 offset-x 之上。
  #
  # 【为什么每行还要各有一个】：三行的宽度天生不等——牌行随出牌张数变，头像行固定三槽，
  # 记牌行是 15 格。只有一个整体 offset-x 时三行只能一起平移，做不到「牌行靠左、
  # 记牌行再往左一点」这类排布。而横向偏移和上下偏移不同，它不吃预生成字形，
  # 任意整数都合法，所以拆成三个的代价只是多三个键。
  #
  # 全填 0（默认）时和只有 offset-x 时完全一样，不影响原有配置
  card-offset-x: 0
  # 头像行单独的水平偏移，同上
  avatar-offset-x: 0
  # 头像描边。在 8x8 头像外面加一圈，变成 10x10。
  # 实现是纯像素膨胀（原本透明、四邻有不透明像素的位置填成描边色），
  # 不依赖 shader，也不影响聊天/记分板等其他文字。
  avatar-outline:
    # 关掉就完全不加描边，头像仍是 8x8
    enabled: true
    # 描边色，支持 #rrggbb 与 #aarrggbb 两种写法。
    # 写错格式会回退成不透明黑并留警告，不会让 HUD 消失。
    # 描边是往外扩的，不会盖掉脸上的像素；代价是头像整体宽高各多 2 像素，
    # 与牌的水平间距观感会变紧，必要时把 avatar-gap 调大一点
    color: "#000000"
  # 记牌器：HUD 的【第三行】，一字排开 15 格（3~2、A、双王），每格显示该点数还剩几张没出。
  # 和上面两行一样共用 offset-x，但有自己独立的开关。
  counter:
    # 只关这一行，牌行与头像行照旧。
    # 单独给开关是因为「嫌它占地方」和「嫌它降低难度」都不该被迫连整条 HUD 一起关掉。
    enabled: true
    # 相邻两格的间距。
    # 【每格自身的宽度不在这里配】：它由剩余张数的位数决定（剩 4 张是一位数、
    # 剩 10 张以上是两位数），是算出来的。配一个固定宽度只会让两位数那几格压字。
    #
    # 15 格一字排开，这一项每加 1 像素整行就宽 14 像素，所以默认取得很小。
    # 不能为负：负值会让点数图标和邻格的数字叠在一起糊成一团，
    # 会回退成 2 并留警告（这一点和 avatar-gap 不同，那里的负值是有意义的紧凑排版）
    gap: 2
    # 某个点数出完（剩 0 张）后，是否把那一格隐藏掉。
    #
    # 【隐藏的只是内容，那一格照样占住原来的宽度】：如果让后面的格子左移填补，
    # 整行会随着出牌不停地变形，靠「第几格」扫读的习惯就废了。
    # 默认 false，即出完仍显示 0——对多数人来说「确认它已经出完」比少一格干扰更有用
    hide-exhausted: false
    # 记牌行单独的水平偏移，叠加在 trick-hud.offset-x 之上。正右负左。
    # 15 格排开后这一行通常比另两行宽得多，需要单独往左拉才对得齐
    offset-x: 0

cards:
  hologram-labels:
    # 牌面数字标签总开关
    enabled: true
    # 为 true 时只给重复点数牌显示标签；为 false 时所有牌都显示
    duplicate-ranks-only: false

audio:
  # 对局中背景音乐音量
  bgm-volume: 0.55
  # 叫分、出牌、胜负等音效音量
  effect-volume: 1.00

actionbar:
  # 当前操作玩家的持续提示倒计时秒数；0 为不显示倒计时
  turn-countdown-seconds: 20
  # 倒计时音效格式：音效名 [音量] [音高]
  countdown-sound: "minecraft:block.note_block.hat 0.5 1.0"
  # 大厅阶段未准备玩家的提醒音效格式：音效名 [音量] [音高]
  unready-warning-sound: "minecraft:block.note_block.didgeridoo 0.55 0.85"

bot:
  # 机器人每次行动前的最短延迟 tick
  action-delay-min-ticks: 10
  # 机器人每次行动前的最长延迟 tick
  action-delay-max-ticks: 0  # 默认 30
  ai:
    # true 时机器人会尝试调用外部 AI 决策；失败或超时会自动回退本地规则
    enabled: true
    # 单次机器人 AI 决策最多等待多久；超过后会直接回退本地规则
    timeout-ms: 0  # 默认 5000

ai:
  deepseek:
    # Bot 调试聊天固定走 DeepSeek；留空密钥时不会真正发请求
    enabled: false
    # 展示名称，仅用于日志和调试提示
    provider-name: "DeepSeek"
    # OpenAI 兼容接口基础地址；DeepSeek 官方可直接使用 https://api.deepseek.com
    # 如果要接别的兼容服务，也可以写成 https://your-host/v1
    url: "https://api.deepseek.com"
    # 对话补全接口路径；默认是 OpenAI 兼容格式
    chat-completions-path: "/chat/completions"
    # 模型列表接口路径；仅用于后续扩展或调试
    models-path: "/models"
    # 接口密钥；留空时即使 enabled=true 也不会发起请求
    api-key: ""
    # 默认模型；DeepSeek 官方常用值如 deepseek-chat / deepseek-reasoner
    model: "deepseek-chat"
    # 建立连接超时毫秒
    connect-timeout-ms: 0  # 默认 10000
    # 单次请求总超时毫秒
    request-timeout-ms: 0  # 默认 45000
    # 默认采样温度，建议 0.0 - 1.3
    temperature: 0  # 默认 0.7
    # 默认最大输出 token；0 表示交给服务端默认策略
    max-tokens: 0
    # 每次请求前附加的系统提示词；默认就是稳健牌风，可在管理菜单里继续微调
    system-prompt: |
      你是 MUZ 的斗地主智能牌局助手，风格冷静、稳健、重视胜率与节奏控制。
      你的第一目标永远是做出合法且高胜率的决策，而不是为了炫技、搞节目效果或追求单手牌面最大。
      炸弹和王炸属于高价值终结资源：除非能直接建立明显优势、阻止对手冲刺、或已经进入收尾阶段，否则不要轻易交出。
      能用普通牌解决的问题，就不要升级到炸弹；能用炸弹解决的问题，就不要升级到王炸。
      先手时优先考虑低风险起手、整理手型、保留关键控制牌；跟牌时优先考虑是否有必要接，而不是见牌就压。
      当对手剩牌很少时，可以适当提高压制优先级；当队友仍有机会接管节奏时，避免过度消耗自己的终结资源。
      如果后续系统消息要求你只输出固定格式，你必须严格服从，不解释、不闲聊、不追加额外文本。

hints:
  # “提示”按钮循环的最大方案数
  max-groups: 0  # 默认 6

debug:
  # /muz debug add 生成多张观察桌时，桌与桌之间的间距
  table-spacing: 0  # 默认 6.50

  web-ui:
    # Debug Web 调试面板。开启后只在服务端本机回环地址监听 port 端口，
    # 可通过 http://127.0.0.1:<port> 或 http://localhost:<port> 打开可编辑 HUD 配置页。
    # 页面可改这些运行期字段：trick-hud.enabled/avatar-scale/avatar-gap/card-step/card-height、
    # trick-hud.offset-down/avatar-offset-down/offset-x/card-offset-x/avatar-offset-x、
    # trick-hud.counter.enabled/gap/hide-exhausted/offset-x、hotbar-hud.enabled/offset-x/offset-y。
    # 不提供构建期 hotbar 字形参数编辑。
    # “保存并应用”先在 Debug Web 单线程异步写回 config.yml 与当前唯一的 hotbar CE overlay，
    # 再切主线程执行 ce reload pack，最后应用 HUD 运行态；“重新读取配置”也走同一条
    # HUD 专用异步链路，只从磁盘重载，不调用完整 reloadVisualState，不重建牌桌，会丢弃页面上尚未保存的改动。
    # 空 patch 不触发资源流程；配置、overlay、CraftEngine 重载或运行态应用任一步失败都不会返回成功。
    # Web 保存/重载共用配置锁，但该锁只覆盖 Web 自身边界，尚未统一其它旧配置入口的竞态。
    # Hotbar 仅在 hotbar-hud.enabled=true、牌桌处于 GamePhase.PLAYING 正式出牌阶段、
    # 且座位为在线真人时显示；LOBBY/BIDDING/DOUBLING/结算/离桌/停服/普通玩家保留原版 9 槽。
    # 非 PLAYING 对局提示走普通 ActionBar；Debug Web 只负责定位参数，不替代游戏内 HUD 渲染。
    # 【警告】不要在生产环境将此端口暴露到公网；仅用于本地调试。
    enabled: false
    # 监听端口。服务只绑定回环地址，外部机器不能直接访问。
    port: 2000
    # 预览拖动交互：只影响 Debug Web 页面，不属于 19 个 HUD 运行期白名单键。
    # snap-enabled=true 是页面初始默认值；页面上的 snapToggle 还可临时切换吸附，
    # 该开关只影响当前页面拖动行为，不写入 HUD patch。
    # 吸附目标基于实际 layer 几何，阈值单位是 Minecraft 像素。
    # center-guides-enabled 控制预览中心线与网格；alt-axis-lock=true 时按住 Alt 首次移动超过死区后锁定主轴。
    drag:
      snap-enabled: true
      snap-threshold: 4
      center-guides-enabled: true
      alt-axis-lock: true

economy:
  payment:
    # false=默认金币结算；true=改用全局筹码结算
    use-chip: false
    # 全局筹码物品建议使用命令 /muz chip setitem 直接设置主手物品
  vault:
    # 是否尝试接入 Vault；未安装 Vault 或经济插件时会自动回退
    enabled: true
    # 同时存在多个 Vault Economy Provider 时，按顺序优先选择
    # 常见可填 EzEconomy、XConomy、CMI、Essentials 等
    preferred-providers:
      - EzEconomy
      - XConomy
      - CMI
    doudizhu:
      # 斗地主基础每分折算多少金币，实际结算会再乘房间倍率
      currency-per-point: 0  # 默认 1.0

room-levels:
  # 放置新牌桌时默认使用的场次
  default-create-level: low
  low:
    # 这个场次在菜单和提示里显示的名字
    label: "低级场"
    # 底分倍率：结算时按「基础分 × 这个倍率」换算成货币。
    # 写 0 表示这一场不结算任何货币（娱乐场就是这么配的），
    # 所以这四项的 0 是真实取值，不参与「0 = 取默认值」那套转换
    multiplier: 100.0
    # 这一场是否接入经济系统。关掉后只记分不动钱
    economy-enabled: true
  mid:
    # 场次显示名
    label: "中级场"
    # 底分倍率，含义同 low.multiplier
    multiplier: 1000.0
    # 是否接入经济系统
    economy-enabled: true
  high:
    # 场次显示名
    label: "高级场"
    # 底分倍率，含义同 low.multiplier
    multiplier: 10000.0
    # 是否接入经济系统
    economy-enabled: true
  fun:
    # 场次显示名
    label: "娱乐场"
    # 0 = 不结算货币，纯打着玩
    multiplier: 0.0
    # 娱乐场默认不接经济
    economy-enabled: false

storage:
  sql:
    # sqlite 或 mysql，默认直接使用插件目录里的 sqlite 文件
    type: sqlite
    sqlite:
      # 数据库文件路径，相对插件数据目录
      file: "storage/data.db"
    # 下面这些只在 type 设为 mysql 时才用得上
    mysql:
      # 数据库地址
      host: "127.0.0.1"
      # 端口，MySQL 默认 3306
      port: 3306
      # 库名，需要先自己建好
      database: "muz"
      # 登录用户名
      username: "root"
      # 登录密码
      password: ""
      # JDBC 连接参数，一般不用改；时区不对会导致记录时间偏移
      parameters: "useSSL=false&characterEncoding=utf8&serverTimezone=Asia/Shanghai"

# 玩家在个人设置菜单里能自选的档位。每档的 label 是菜单上显示的名字，
# spec 是这一档实际生效的内容。想加档就照着格式往下加 profile-5、profile-6
player-options:
  # 选牌时的提示音。spec 格式：音效名 [音量] [音高] [随机音高浮动]
  selection-sound-profiles:
    profile-1:
      # 菜单上显示的档位名
      label: "清脆提示"
      # 音效名 音量 音高 随机浮动
      spec: "minecraft:block.note_block.pling 0.4 1.2 0.9"
    profile-2:
      # 菜单上显示的档位名
      label: "告示牌提示"
      # 音效名 音量 音高 随机浮动
      spec: "minecraft:block.hanging_sign.place 0.4 1.1 0.9"
    profile-3:
      # 菜单上显示的档位名
      label: "洞穴提示"
      # 音效名 音量 音高 随机浮动
      spec: "minecraft:ambient.cave 0.3 1.0 0.9"
    profile-4:
      # 菜单上显示的档位名
      label: "静音"
      # 音量那一位写 0 就听不见，音效名本身留着不影响
      spec: "minecraft:block.note_block.hat 0.0 1.0 1.0"
  # 出牌成功后额外做什么。spec 用 "type: 类型; 参数: 值" 的写法，
  # 支持 none（什么都不做）、message（发聊天）、actionbar（发动作栏）、play_sound（放音效）。
  # 文本里可以用 <arg:pattern> 引用刚出的牌型、<arg:player.name> 引用出牌人
  play-action-profiles:
    profile-1:
      # 菜单上显示的档位名
      label: "无操作"
      # type: none 表示出牌后不做任何额外提示
      spec: "type: none"
    profile-2:
      # 菜单上显示的档位名
      label: "聊天提示"
      # type: message 表示往聊天栏发一条，message 后面是 MiniMessage 富文本
      spec: "type: message; message: <#8FD4FF>出牌完成</#8FD4FF><dark_gray> · </dark_gray><#F1D398><arg:pattern></#F1D398>"
    profile-3:
      # 菜单上显示的档位名
      label: "动作栏提示"
      # type: actionbar 表示发到物品栏上方那一行，不占聊天记录
      spec: "type: actionbar; actionbar: <#9AA8B6><arg:player.name></#9AA8B6><dark_gray> · </dark_gray><#F1D398><arg:pattern></#F1D398>"
    profile-4:
      # 菜单上显示的档位名
      label: "播放音效"
      # type: play_sound 表示放个音效；source 是音量分类，master 跟随主音量
      spec: "type: play_sound; sound: minecraft:entity.player.levelup; volume: 0.35; pitch: 1.05; source: master"

# ============================================================================
# 底部物品栏 HUD（实验性功能）
# ============================================================================
# 用 ActionBar 通道 + 字形负 ascent 渲染自定义 5 槽物品栏背景。
# 仅当牌桌处于 GamePhase.PLAYING 正式出牌阶段，且座位为在线真人时周期推送；
# LOBBY、BIDDING、DOUBLING、结算、离桌、停服及不在牌桌的普通玩家保持或恢复原版 9 槽。
# 资源包不得覆盖 minecraft 原版 hotbar.png / hotbar_selection.png，避免全局影响普通物品栏。
# 所有非 PLAYING 阶段的对局提示直接走普通 ActionBar，游戏流程不受影响。
hotbar-hud:
  # 是否启用。false 时降级为普通 ActionBar（对局功能不受影响）。
  # 【注意】启用后需要玩家重新下载包含自定义字形的资源包才能看到效果；资源包不会全局隐藏原版 hotbar。
  enabled: false
  # 槽位底图水平偏移（像素，正数右移、负数左移）。
  # 走 CraftEngine 负空格实现，【运行期即时生效】：/muz reload 或 Debug Web 保存后
  # 下一次推送就能看到，不需要重新构建、不需要玩家重下资源包。
  # 任意整数都合法，不依赖预生成字形。
  offset-x: 0
  # 槽位底图垂直偏移（像素，正数向下、负数向上）。
  # 【与 offset-x 不同，这个不是即时的】：垂直位置由位图字形的 ascent 决定，
  # 而 ascent 烘焙在资源包里。Debug Web 会把这个值写成一份「调试覆盖层」资源
  # （plugins/CraftEngine/resources/muz_hotbar_debug/，ascent = -128 - offset-y），
  # 然后触发 CraftEngine 重新打包资源包。所以每改一次都要：
  # 写文件 → 执行 ce reload pack 重建客户端资源包 → 客户端重新下载资源包，才能看到效果。
  # 覆盖层不存在时此值不生效，底图仍按 bundle 内烘焙的 ascent(-128) 显示。
  # 取值受 Minecraft 的「ascent 不得大于 height」限制，向上偏移会被钳位（见 Debug Web 面板提示）。
  offset-y: 0
  # 槽位字形的垂直偏移（ascent 值），构建期烘焙进 CraftEngine bundle。
  # 【当前运行期并不读取这个键】，它只记录构建期约定：build.gradle.kts 生成
  # hotbar_hud.yml 时把 ascent 写成字面量 -128（负值向下推，字形出现在屏幕底部物品栏区域）。
  # 要在运行期调垂直位置请改上面的 offset-y（走调试覆盖层），不要改这里 ——
  # 改这里不会有任何效果，真要动构建期烘焙值必须同步 build.gradle.kts 生成侧、
  # PackAssets 的 hotbar 宽度/advance/码位约定，并重新构建、重启服务器、让玩家重下资源包。
  glyph-ascent: -128
  # 槽位数量（当前固定 5 个）。
  # 【当前运行期同样不读取这个键】，槽数由构建期 182×22 遮罩贴图与
  # PackAssets.HOTBAR_HUD_GLYPH_WIDTH=182 / HOTBAR_HUD_GLYPH_ADVANCE=183 共同决定：
  # 中央 5 槽占 108px（5 × 20px + 4 × 2px），左右各 37px 负责遮住原版外围槽。
  # 改这里不生效，不要作为普通配置项调整。
  slot-count: 5
